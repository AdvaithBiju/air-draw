<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Air Draw</title>
<style>
  :root { --ink: #ffdc3c; --good: #78ff78; --bad: #ff5a5a; --panel: rgba(0,0,0,.55); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #111; color: #fff; font-family: system-ui, "Segoe UI", sans-serif;
         height: 100vh; display: grid; place-items: center; overflow: hidden; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas#view { width: 100%; height: 100%; display: block; background: #000; border-radius: 8px; }
  video { display: none; }
  .bar { position: absolute; left: 0; right: 0; background: var(--panel); padding: 14px 24px;
         display: flex; align-items: center; gap: 16px; }
  #top { top: 0; border-radius: 8px 8px 0 0; }
  #bottom { bottom: 0; border-radius: 0 0 8px 8px; justify-content: space-between; font-size: 22px; }
  #prompt { font-size: 22px; color: #ccc; }
  #prompt b { color: var(--ink); font-size: 34px; text-transform: uppercase; margin-left: 8px; }
  #score { margin-left: auto; color: #ccc; font-size: 20px; }
  #timer { font-size: 34px; font-weight: 700; min-width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
  #timer.low { color: var(--bad); }
  #progress { position: absolute; left: 0; bottom: 0; height: 4px; background: #fff; transition: width .1s linear; }
  #progress.low { background: var(--bad); }
  #others { color: #aaa; font-size: 17px; }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.6); border-radius: 8px;
             display: flex; flex-direction: column; align-items: center; justify-content: center;
             gap: 14px; text-align: center; padding: 16px; }
  .overlay h1 { margin: 0; font-size: clamp(36px, 7vw, 80px); color: var(--ink); letter-spacing: 2px; }
  .overlay h2 { margin: 0; font-size: clamp(26px, 4vw, 48px); }
  .overlay p { margin: 0; font-size: clamp(15px, 1.8vw, 22px); color: #ddd; }
  button { font: inherit; font-size: 22px; padding: 12px 32px; border-radius: 999px; border: 0;
           background: var(--good); color: #111; font-weight: 700; cursor: pointer; margin-top: 12px; }
  button:disabled { background: #666; cursor: wait; }
  button.small { font-size: 16px; padding: 8px 16px; margin: 0 0 0 24px; background: rgba(255,255,255,.15); color: #fff; font-weight: 600; }
  button.small:hover { background: rgba(255,255,255,.28); }
  kbd { font: 12px ui-monospace, monospace; border: 1px solid rgba(255,255,255,.5); border-radius: 4px; padding: 1px 5px; margin-left: 6px; }
  .hint { color: #aaa !important; font-size: 15px !important; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="stage">
  <video id="cam" playsinline muted></video>
  <canvas id="view" width="1280" height="720"></canvas>

  <div id="top" class="bar" hidden>
    <div id="prompt">Draw:<b id="target"></b></div>
    <button id="eraseBtn" class="small" title="Erase all (E)">🧽 Erase all <kbd>E</kbd></button>
    <div id="score"></div>
    <div id="timer">50s</div>
    <div id="progress"></div>
  </div>
  <div id="bottom" class="bar" hidden>
    <div id="guess">Start drawing with your index finger!</div>
    <div id="others"></div>
  </div>

  <div id="menu" class="overlay">
    <h1>AIR DRAW</h1>
    <p>I'll tell you what to draw. You have 50 seconds.</p>
    <p>☝️ Index finger = draw &nbsp;&nbsp; 🖐️ Open palm (5 fingers) = stop</p>
    <button id="startBtn" disabled>Loading…</button>
    <p class="hint">SPACE start / next &nbsp;·&nbsp; E erase all</p>
  </div>

  <div id="result" class="overlay" hidden>
    <h2 id="resultTitle"></h2>
    <p id="resultMsg"></p>
    <button id="nextBtn">Next drawing</button>
    <p class="hint">or press SPACE</p>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
